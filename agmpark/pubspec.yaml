name: agmpark
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  firebase_core: ^4.10.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  table_calendar: ^3.1.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logoagm2.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logoagm2.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/logoagm2.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/images/logoagm2.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logoagm2.png"

